# Pings the deployed API from outside Render, so a service that did fall asleep
# (a restart, a missed in-process ping) is woken again within minutes. The
# in-process job in src/jobs/keepAlive.js keeps it awake the rest of the time.
#
# Set the repository variable API_HEALTH_URL (Settings → Secrets and variables
# → Actions → Variables) to https://<service>.onrender.com/api/health. Without
# it the job skips. GitHub may run scheduled workflows late under load, and
# disables them after 60 days with no repository activity.
name: Keep API alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_HEALTH_URL != '' }}
    steps:
      - name: Ping health endpoint
        run: |
          # Retries cover a cold start, which can take close to a minute.
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 90 \
            "${{ vars.API_HEALTH_URL }}"
